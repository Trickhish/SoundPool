<div class="np-bar" *ngIf="playback.nowPlaying as np">
  <div class="np-info" (click)="openRoom()" title="Open room">
    <img class="np-cover" [src]="np.cover || 'soundpool_sqrd.png'" />
    <div class="np-text">
      <span class="np-title">{{ np.title }}</span>
      <span class="np-artist">{{ np.artist }}<span class="np-room" *ngIf="playback.roomName"> · {{ playback.roomName }}</span></span>
    </div>
  </div>

  <div class="np-controls">
    <button class="np-btn" *ngIf="playback.canSkip" (click)="playback.prev()" title="Previous">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="np-btn play" *ngIf="playback.canPlayPause" (click)="playback.toggle()" [title]="playback.playing ? 'Pause' : 'Play'">
      <svg *ngIf="!playback.playing" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg *ngIf="playback.playing" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <button class="np-btn" *ngIf="playback.canSkip" (click)="playback.next()" title="Next">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
    </button>
  </div>
</div>
