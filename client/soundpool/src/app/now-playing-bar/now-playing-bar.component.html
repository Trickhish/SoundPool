<div class="np-bar" *ngIf="!onActiveRoomPage && playback.nowPlaying as np">
  <div class="np-info" (click)="openRoom()" title="Open room">
    <img class="np-cover" [src]="np.cover || 'soundpool_sqrd.png'" />
    <div class="np-text">
      <span class="np-title">{{ np.title }}</span>
      <span class="np-artist">{{ np.artist }}<span class="np-room" *ngIf="playback.roomName"> · {{ playback.roomName }}</span></span>
    </div>
  </div>

  <div class="np-controls">
    <button class="np-btn" [disabled]="playback.rightsLoaded && !playback.canSkip" (click)="playback.prev()" title="Previous">
      <fa-icon [icon]="['fas','backward-step']"></fa-icon>
    </button>
    <button class="np-btn play" [disabled]="playback.rightsLoaded && !playback.canPlayPause" (click)="playback.toggle()" [title]="playback.playing ? 'Pause' : 'Play'">
      <fa-icon [icon]="playback.playing ? ['fas','pause'] : ['fas','play']"></fa-icon>
    </button>
    <button class="np-btn" [disabled]="playback.rightsLoaded && !playback.canSkip" (click)="playback.next()" title="Next">
      <fa-icon [icon]="['fas','forward-step']"></fa-icon>
    </button>
  </div>
</div>
