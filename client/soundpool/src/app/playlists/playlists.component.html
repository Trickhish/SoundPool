<div class="content">
  <div class="playlists-wrap">

    <!-- Deezer section -->
    <section class="pl-section">
      <div class="section-head">
        <span class="section-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        </span>
        <h2 class="section-title">Deezer</h2>
        <span *ngIf="!deezerLoading && deezerConnected" class="track-count">{{ deezerPlaylists.length }} playlists</span>
      </div>

      <!-- Loading -->
      <div *ngIf="deezerLoading" class="loading-row">
        <div class="spinner"></div>
        <span>Loading playlists…</span>
      </div>

      <!-- Not connected -->
      <div *ngIf="!deezerLoading && !deezerConnected" class="empty-state">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p>Connect your Deezer account in <strong>Profile</strong> to see your playlists.</p>
      </div>

      <!-- Grid -->
      <div *ngIf="!deezerLoading && deezerConnected && !opened" class="pl-grid">
        <div *ngFor="let pl of deezerPlaylists" class="pl-card" (click)="open(pl)">
          <div class="pl-cover">
            <img *ngIf="pl.picture" [src]="pl.picture" [alt]="pl.title" />
            <div *ngIf="!pl.picture" class="pl-cover-placeholder">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
            </div>
            <div class="pl-actions">
              <button class="pl-play" (click)="playPlaylist(pl, false, $event)" [disabled]="starting !== null" title="Play">
                <fa-icon [icon]="['fas','play']"></fa-icon>
              </button>
              <button class="pl-play shuffle" (click)="playPlaylist(pl, true, $event)" [disabled]="starting !== null" title="Shuffle play">
                <fa-icon [icon]="['fas','shuffle']"></fa-icon>
              </button>
            </div>
          </div>
          <div class="pl-info">
            <span class="pl-title">{{ pl.title }}</span>
            <span class="pl-meta">{{ pl.nb_tracks }} tracks</span>
          </div>
        </div>
      </div>

      <!-- Opened playlist: track list -->
      <div *ngIf="opened" class="pl-detail">
        <div class="detail-head">
          <button class="back-btn" (click)="back()" title="Back">
            <fa-icon [icon]="['fas','chevron-left']"></fa-icon>
          </button>
          <span class="detail-title">{{ opened.title }}</span>
          <button class="detail-play" (click)="playPlaylist(opened, false)" [disabled]="starting !== null || tracksLoading" title="Play">
            <fa-icon [icon]="['fas','play']"></fa-icon>
          </button>
          <button class="detail-play shuffle" (click)="playPlaylist(opened, true)" [disabled]="starting !== null || tracksLoading" title="Shuffle play">
            <fa-icon [icon]="['fas','shuffle']"></fa-icon>
          </button>
          <button class="add-all" (click)="addAll()" [disabled]="addingAll || tracksLoading">
            {{ addingAll ? 'Adding…' : 'Add all' }}
          </button>
        </div>
        <span class="detail-target" *ngIf="playback.roomName">Adding to <strong>{{ playback.roomName }}</strong></span>

        <div *ngIf="tracksLoading" class="loading-row"><div class="spinner"></div><span>Loading tracks…</span></div>

        <div *ngFor="let t of tracks" class="track-row" appLongPress (press)="openCtx($event, t)" (click)="addTrack(t)">
          <img class="track-cover" [src]="t.img_url || 'soundpool_sqrd.png'" [alt]="t.title" />
          <div class="track-info">
            <span class="track-title">{{ t.title }}</span>
            <span class="track-artist">{{ t.artist }}</span>
          </div>
          <fa-icon class="track-add" [icon]="['fas','plus']"></fa-icon>
        </div>
      </div>
    </section>

    <!-- SoundPool section -->
    <section class="pl-section">
      <div class="section-head">
        <span class="section-icon accent">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </span>
        <h2 class="section-title">SoundPool</h2>
      </div>

      <div class="empty-state">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <p>No playlists yet.</p>
        <button class="btn-accent" disabled>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New playlist
        </button>
      </div>
    </section>

  </div>

  <!-- ── Track context menu (long-press / right-click) ── -->
  <div class="ctx-backdrop" *ngIf="ctx.open" (click)="closeCtx()" (contextmenu)="$event.preventDefault(); closeCtx()"></div>
  <div class="ctx-menu" *ngIf="ctx.open" [style.left.px]="ctx.x" [style.top.px]="ctx.y">
    <button class="ctx-item" (click)="playNext(ctx.track)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      Play next
    </button>
    <button class="ctx-item" (click)="addToQueue(ctx.track)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Add to queue
    </button>
  </div>
</div>
